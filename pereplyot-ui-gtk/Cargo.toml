[package]
name = "pereplyot-ui-gtk"
version = "0.6.0"
description = "Pereplyot — standalone PDF/EPUB reader (proprietary)"
license = "LicenseRef-Proprietary"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "pereplyot"
path = "src/main.rs"

[dependencies]
fond-read-gtk = { path = "../crates/fond-read-gtk" }
fond-bib = { workspace = true }
fond-doc = { workspace = true }
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
glib = "0.22"
gio = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
