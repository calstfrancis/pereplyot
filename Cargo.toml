[workspace]
resolver = "2"
members = ["crates/fond-read-gtk", "pereplyot-ui-gtk"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Cal St Francis <calstfrancis@gmail.com>"]
repository = "https://github.com/calstfrancis/pereplyot"

[workspace.dependencies]
# The document/annotation primitives fond-read-gtk depends on stay in Kartoteka (MIT,
# UI-agnostic) — only the proprietary reader widget crate itself moved here. Pinned to
# Kartoteka's current release tag; bump deliberately, not automatically, the same way
# Sputnik pins its own Kartoteka-sourced dependencies.
fond-bib = { git = "https://github.com/calstfrancis/kartoteka", tag = "v0.16.0" }
fond-doc = { git = "https://github.com/calstfrancis/kartoteka", tag = "v0.16.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
