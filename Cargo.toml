[workspace]
resolver = "2"
members = ["crates/fond-read-gtk", "pereplyot-ui-gtk"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Cal St Francis <calstfrancis@gmail.com>"]
repository = "https://github.com/calstfrancis/pereplyot"

[workspace.dependencies]
# The document and annotation primitives (fond-doc, fond-annot) come from fond-core (MIT,
# UI-agnostic). fond-bib (the vault Library/Note, for the Kartoteka launch mode) still comes
# from Kartoteka and re-exports the same fond-annot types, so both must stay on one
# fond-annot revision. Pinned by rev; bump deliberately.
fond-bib = { git = "https://github.com/calstfrancis/kartoteka", rev = "3a643e4a5489260c321a36c64b4347cbd1ff8d04" }
fond-annot = { git = "https://github.com/calstfrancis/fond-core", rev = "b910bc66d" }
fond-doc = { git = "https://github.com/calstfrancis/fond-core", rev = "b910bc66d" }
# Same version/features fond-doc builds it with, so the two unify into one crate — only
# needed directly for page geometry (crop-box origin, /Rotate) that fond-doc doesn't expose.
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
