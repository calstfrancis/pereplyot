app-id: io.github.calstfrancis.Pereplyot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pereplyot

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  # Broadened from a scoped ~/.local/share/pereplyot:create grant (2026-09-22): Kartoteka
  # and Sputnik now launch this binary directly to open a document on their own behalf
  # (--vault=<root> --key=<key>, or --annotations-file=<path>), writing straight into
  # their vault/material store instead of Pereplyot's own local one — see
  # pereplyot/README.md's "Relationship to Kartoteka and Sputnik". A vault can live
  # anywhere under $HOME, so this can no longer stay scoped to Pereplyot's own directory;
  # matches what Kartoteka's and Sputnik's own manifests already grant themselves.
  - --filesystem=home
  # PDFium is bundled into /app/lib; point the app at it explicitly.
  - --env=PDFIUM_LIB_PATH=/app/lib

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/pereplyot/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  # Tesseract (Apache-2.0) and Leptonica (BSD-2-Clause) for "Recognise text" on scanned
  # documents, with English data (tessdata_fast, Apache-2.0); other languages are downloaded on
  # demand into ~/.local/share/pereplyot/tessdata. Pereplyot hands Tesseract its pages as PPM on
  # stdin, so Leptonica is built without the image-format libraries.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DSW_BUILD=OFF
      - -DENABLE_ZLIB=OFF
      - -DENABLE_PNG=OFF
      - -DENABLE_GIF=OFF
      - -DENABLE_JPEG=OFF
      - -DENABLE_TIFF=OFF
      - -DENABLE_WEBP=OFF
      - -DENABLE_OPENJPEG=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.84.1/leptonica-1.84.1.tar.gz
        sha256: 2b3e1254b1cca381e77c819b59ca99774ff43530209b9aeb511e1d46588a64f6

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_PREFIX_PATH=/app
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DOPENMP_BUILD=OFF
      - -DGRAPHICS_DISABLED=ON
    post-install:
      - install -Dm644 ../eng.traineddata /app/share/tessdata/eng.traineddata
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/refs/tags/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  - name: pereplyot
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/calstfrancis/pereplyot.git
        branch: main
      # Vendored cargo dependencies. Regenerate with flatpak-cargo-generator whenever
      # Cargo.lock changes (root CLAUDE.md's vendored-dependency rule).
      - cargo-sources.json
      # PDFium native library (BSD-3-Clause), same pinned build Kartoteka bundles.
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7961/pdfium-linux-x64.tgz
        sha256: 019665c8877d46fe65f625f80fd714ab07aac68554b0636acf2a2adf9288adb2
        dest: pdfium
        strip-components: 0
      - type: file
        path: io.github.calstfrancis.Pereplyot.metainfo.xml
    build-commands:
      - mkdir -p cargo
      - printf '[source.vendored-sources]\ndirectory = "/run/build/pereplyot/cargo/vendor"\n\n[source.crates-io]\nreplace-with = "vendored-sources"\n' > cargo/config.toml
      - cargo --offline build --release -p pereplyot-ui-gtk
      - install -Dm755 target/release/pereplyot /app/bin/pereplyot
      - strip /app/bin/pereplyot
      # Bundle PDFium (BSD-3).
      - install -Dm755 pdfium/lib/libpdfium.so /app/lib/libpdfium.so
      # Desktop entry, icon, AppStream metainfo.
      - install -Dm644 packaging/io.github.calstfrancis.Pereplyot.desktop /app/share/applications/io.github.calstfrancis.Pereplyot.desktop
      - install -Dm644 packaging/fonts/NewCM10-Regular.otf /app/share/fonts/NewCM10-Regular.otf
      - install -Dm644 packaging/fonts/NewCM10-Italic.otf /app/share/fonts/NewCM10-Italic.otf
      - install -Dm644 packaging/fonts/NewCM10-Bold.otf /app/share/fonts/NewCM10-Bold.otf
      - install -Dm644 packaging/fonts/NewCM10-BoldItalic.otf /app/share/fonts/NewCM10-BoldItalic.otf
      - install -Dm644 packaging/pereplyot.svg /app/share/icons/hicolor/scalable/apps/io.github.calstfrancis.Pereplyot.svg
      - install -Dm644 io.github.calstfrancis.Pereplyot.metainfo.xml /app/share/metainfo/io.github.calstfrancis.Pereplyot.metainfo.xml
