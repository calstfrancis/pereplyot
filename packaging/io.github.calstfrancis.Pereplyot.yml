app-id: io.github.calstfrancis.Pereplyot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pereplyot

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  # Broadened from a scoped ~/.local/share/pereplyot:create grant (2026-09-22): Kartoteka
  # and Sputnik now launch this binary directly to open a document on their own behalf
  # (--vault=<root> --key=<key>, or --annotations-file=<path>), writing straight into
  # their vault/material store instead of Pereplyot's own local one — see
  # pereplyot/README.md's "Relationship to Kartoteka and Sputnik". A vault can live
  # anywhere under $HOME, so this can no longer stay scoped to Pereplyot's own directory;
  # matches what Kartoteka's and Sputnik's own manifests already grant themselves.
  - --filesystem=home
  # PDFium is bundled into /app/lib; point the app at it explicitly.
  - --env=PDFIUM_LIB_PATH=/app/lib

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/pereplyot/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: pereplyot
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/calstfrancis/pereplyot.git
        branch: main
      # Vendored cargo dependencies. Regenerate with flatpak-cargo-generator whenever
      # Cargo.lock changes (root CLAUDE.md's vendored-dependency rule).
      - cargo-sources.json
      # PDFium native library (BSD-3-Clause), same pinned build Kartoteka bundles.
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7961/pdfium-linux-x64.tgz
        sha256: 019665c8877d46fe65f625f80fd714ab07aac68554b0636acf2a2adf9288adb2
        dest: pdfium
        strip-components: 0
      - type: file
        path: io.github.calstfrancis.Pereplyot.metainfo.xml
    build-commands:
      - mkdir -p cargo
      - printf '[source.vendored-sources]\ndirectory = "/run/build/pereplyot/cargo/vendor"\n\n[source.crates-io]\nreplace-with = "vendored-sources"\n' > cargo/config.toml
      - cargo --offline build --release -p pereplyot-ui-gtk
      - install -Dm755 target/release/pereplyot /app/bin/pereplyot
      - strip /app/bin/pereplyot
      # Bundle PDFium (BSD-3).
      - install -Dm755 pdfium/lib/libpdfium.so /app/lib/libpdfium.so
      # Desktop entry, icon, AppStream metainfo.
      - install -Dm644 packaging/io.github.calstfrancis.Pereplyot.desktop /app/share/applications/io.github.calstfrancis.Pereplyot.desktop
      - install -Dm644 packaging/pereplyot.svg /app/share/icons/hicolor/scalable/apps/io.github.calstfrancis.Pereplyot.svg
      - install -Dm644 io.github.calstfrancis.Pereplyot.metainfo.xml /app/share/metainfo/io.github.calstfrancis.Pereplyot.metainfo.xml
