<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63"/>
      <stop offset="1" stop-color="#232c3d"/>
    </linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8923a"/>
      <stop offset="0.5" stop-color="#e8cf84"/>
      <stop offset="1" stop-color="#b8923a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>

  <!-- the open book: two pages curving into the binding -->
  <path d="M20 40 Q 42 30 64 40 L 64 100 Q 42 90 20 100 Z" fill="#fbf8ef"/>
  <path d="M108 40 Q 86 30 64 40 L 64 100 Q 86 90 108 100 Z" fill="#efeadb"/>
  <path d="M20 100 Q 42 90 64 100 Q 86 90 108 100 L 108 105 Q 86 95 64 105 Q 42 95 20 105 Z" fill="#c9c1a8"/>

  <!-- four marks in the four reading colours: key idea, evidence, connection, problem -->
  <rect x="28" y="50" width="28" height="6" rx="3" fill="#d6b86a"/>
  <rect x="28" y="62" width="22" height="6" rx="3" fill="#91a9b8"/>
  <rect x="28" y="74" width="26" height="6" rx="3" fill="#9caf88"/>
  <rect x="28" y="86" width="18" height="6" rx="3" fill="#c98f78"/>
  <rect x="74" y="50" width="26" height="4" rx="2" fill="#cfc8b2"/>
  <rect x="74" y="60" width="22" height="4" rx="2" fill="#cfc8b2"/>
  <rect x="74" y="70" width="26" height="4" rx="2" fill="#cfc8b2"/>
  <rect x="74" y="80" width="16" height="4" rx="2" fill="#cfc8b2"/>

  <!-- the gilt spine and its ribbon -->
  <rect x="61" y="30" width="6" height="76" rx="2" fill="url(#gilt)"/>
  <path d="M66 98 L66 116 L72 110 L78 116 L78 98 Z" fill="#c98f78"/>
</svg>
